<!-- 构建指纹。build_site.py 会把这里替换成资源内容哈希（见该脚本的
     "asset version stamp" 段）。作用有两个：给 assets 的 ?v= 提供版本号，
     以及让读者/排障能一眼看出「当前页面是哪个构建」—— 这一条是为了让
     「浏览器缓存了旧 app.js」这种故障从不可见变成可见、可上报。
     开发时（直接开 web/index.html）这里是 dev，不影响功能。 -->
<meta name="app-build" content="dev">

<body>
<a class="skip-link" href="#main">跳到主内容</a>

<div id="app">
  <!-- ==================== LEFT RAIL ==================== -->
  <aside class="rail" id="rail" aria-label="主导航">
    <div class="brand">
      <div class="brand-mark">F</div>
      <div class="brand-text">
        <span class="brand-title">Future</span>
        <span class="brand-sub">求职学习工作台</span>
      </div>
      <button class="icon-btn brand-mini" id="rail-close" aria-label="关闭导航" style="margin-left:auto">
        <svg><use href="#i-x"/></svg>
      </button>
    </div>

    <div class="rail-scroll">
      <nav class="nav-group" aria-label="总览">
        <div class="nav-group-title">总览</div>
        <button class="nav-item" data-route="#/dashboard"><svg class="nav-icon"><use href="#i-home"/></svg><span class="nav-label">今日工作台</span></button>
        <button class="nav-item" data-route="#/digest"><svg class="nav-icon"><use href="#i-feed"/></svg><span class="nav-label">每日更新流</span><span class="nav-count" id="nav-count-digest">0</span></button>
        <button class="nav-item" data-route="#/categories"><svg class="nav-icon"><use href="#i-grid"/></svg><span class="nav-label">知识分类</span><span class="nav-count" id="nav-count-cats">0</span></button>
      </nav>

      <nav class="nav-group" aria-label="知识库">
        <div class="nav-group-title">知识库</div>
        <button class="nav-item" data-route="#/knowledge"><svg class="nav-icon"><use href="#i-layers"/></svg><span class="nav-label">知识卡片</span><span class="nav-count" id="nav-count-kb">0</span></button>
        <button class="nav-item" data-route="#/formulas"><svg class="nav-icon"><use href="#i-sigma"/></svg><span class="nav-label">公式剖析</span><span class="nav-count" id="nav-count-formula">0</span></button>
        <button class="nav-item" data-route="#/problems"><svg class="nav-icon"><use href="#i-code"/></svg><span class="nav-label">题库定位</span><span class="nav-count" id="nav-count-problems">0</span></button>
        <button class="nav-item" data-route="#/repos"><svg class="nav-icon"><use href="#i-repo"/></svg><span class="nav-label">仓库与课程</span><span class="nav-count" id="nav-count-repos">0</span></button>
      </nav>

      <nav class="nav-group" aria-label="求职">
        <div class="nav-group-title">求职</div>
        <button class="nav-item" data-route="#/jobs"><svg class="nav-icon"><use href="#i-briefcase"/></svg><span class="nav-label">岗位看板</span><span class="nav-count" id="nav-count-jobs">0</span></button>
        <button class="nav-item" data-route="#/skills"><svg class="nav-icon"><use href="#i-target"/></svg><span class="nav-label">技能矩阵</span><span class="nav-count" id="nav-count-skills">0</span></button>
        <button class="nav-item" data-route="#/roadmap"><svg class="nav-icon"><use href="#i-route"/></svg><span class="nav-label">学习路线</span></button>
      </nav>

      <nav class="nav-group" aria-label="我的">
        <div class="nav-group-title">我的</div>
        <button class="nav-item" data-route="#/progress"><svg class="nav-icon"><use href="#i-chart"/></svg><span class="nav-label">进度与统计</span></button>
        <button class="nav-item" data-route="#/starred"><svg class="nav-icon"><use href="#i-star"/></svg><span class="nav-label">收藏夹</span><span class="nav-count" id="nav-count-star">0</span></button>
        <button class="nav-item" data-route="#/pipeline"><svg class="nav-icon"><use href="#i-flask"/></svg><span class="nav-label">采集与运行</span><span class="nav-count" id="nav-count-pipeline">0</span></button>
      </nav>

      <nav class="nav-group" aria-label="分类筛选">
        <div class="nav-group-title">按分类浏览</div>
        <div id="rail-cats"></div>
      </nav>
    </div>

    <div class="rail-foot">
      <div class="status-line" id="rail-status">
        <svg style="width:13px;height:13px" class="muted"><use href="#i-database"/></svg>
        <span>数据加载中…</span>
      </div>
    </div>
  </aside>

  <!-- ==================== TOPBAR ==================== -->
  <header class="topbar">
    <button class="icon-btn" id="rail-open" aria-label="打开导航" style="display:none">
      <svg><use href="#i-menu"/></svg>
    </button>

    <button class="cmd-trigger" id="cmd-trigger" aria-label="打开命令面板与搜索">
      <svg style="width:14px;height:14px"><use href="#i-search"/></svg>
      <span>搜索知识、岗位、题目、仓库…</span>
      <kbd>Ctrl K</kbd>
    </button>

    <div class="topbar-actions">
      <!-- The 舒适/紧凑 density switch was removed here: nothing ever read
           `data-density` (no CSS rule targeted it), so it was a control with no
           effect. -->

      <button class="btn btn-sm btn-ghost" id="btn-refresh" data-tip="重新读取本地数据层">
        <svg><use href="#i-refresh"/></svg><span>刷新</span>
      </button>

      <button class="btn btn-sm btn-ghost btn-icon" id="btn-print" aria-label="打印/导出" data-tip="打印当前视图">
        <svg><use href="#i-download"/></svg>
      </button>

      <button class="btn btn-sm btn-ghost btn-icon" id="btn-theme" aria-label="切换主题" data-tip="主题与配色">
        <svg><use href="#i-palette"/></svg>
      </button>
    </div>
  </header>

  <!-- ==================== MAIN ==================== -->
  <main class="main" id="main" tabindex="-1">
    <div class="main-inner" id="view">
      <div class="empty">
        <svg><use href="#i-activity"/></svg>
        <h4>正在初始化工作台</h4>
        <p>读取本地数据层（data/ 目录）…</p>
      </div>
    </div>
  </main>
</div>

<!-- ==================== OVERLAYS ==================== -->
<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title" aria-hidden="true">
  <div class="drawer-head">
    <div class="grow">
      <div class="eyebrow" id="drawer-eyebrow">知识详情</div>
      <h2 id="drawer-title" style="font-size:var(--fs-lg);margin-top:4px">—</h2>
      <div id="drawer-meta" class="row" style="margin-top:8px;flex-wrap:wrap;gap:6px"></div>
    </div>
    <button class="icon-btn" id="drawer-close" aria-label="关闭详情">
      <svg><use href="#i-x"/></svg>
    </button>
  </div>
  <div class="drawer-body" id="drawer-body"></div>
  <div class="drawer-foot" id="drawer-foot"></div>
</aside>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="false"></div>

<div id="palette-root"></div>
<div id="popover-root"></div>

<noscript>
  <div style="padding:2rem;max-width:60ch;margin:0 auto">
    <h1>需要启用 JavaScript</h1>
    <p>本工作台的界面渲染依赖 JavaScript。数据本身是 data/ 目录下的纯 JSON 文件，可直接阅读。</p>
  </div>
</noscript>

<!-- Classic script (not a module) so the workbench also runs straight from
     file:// without a server. Generated by scripts/build.mjs. -->
<script src="assets/js/app.js"></script>
</body>
</html>
